name: Backend CI

on:
  push:
    branches: feature
    paths:
      - "backend/**"
  pull_request:
    branches: feature
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Check Node version
        run: node -v

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: "prisma://accelerate.prisma-data.net/?api_key=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..D1i0ElglnyCxm3aPCDq3_husT6OPrh9tnDmXNRjReZI"
        run: npx prisma generate

        
      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
