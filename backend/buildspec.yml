version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Generating Prisma Client..."
      - npx prisma generate

  build:
    commands:
      - echo "Building NestJS application..."
      - npm run build

artifacts:
  files:
    - '**/*'
