version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies for build only"
      - npm ci
      - npx prisma generate

  build:
    commands:
      - npm run build

artifacts:
  files:
    - backend/dist/**
    - backend/package.json
    - backend/package-lock.json
    - backend/prisma/**
    - appspec.yml
    - scripts/**
