version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - cd backend
      - npm ci

  pre_build:
   commands:
    # - echo "Skipping prisma generate during build"
    - npx prisma generate

  build:
    commands:
      - echo "Building NestJS application..."
      - npm run build

artifacts:
  files:
    - appspec.yml
    - backend/dist/**/*
    - backend/scripts/**/*
    - backend/prisma/**/*
    - backend/package.json
    - backend/package-lock.json
    # - backend/node_modules/**/*
