version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd backend
      - npm ci
  build:
    commands:
      - npm run build || echo "No build step"
  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  base-directory : backend
  files:
    - '**/*'
