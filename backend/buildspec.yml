version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Entering backend directory"
      - cd backend
      - echo "Installing dependencies"
      - npm ci
      - npx prisma generate

  build:
    commands:
      - echo "Building backend"
      - npm run build

artifacts:
  files:
    - backend/dist/**
    - backend/package.json
    - backend/package-lock.json
    - backend/prisma/**
    - backend/appspec.yml
    - backend/install/**
