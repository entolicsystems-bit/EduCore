version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - cd backend
      - npm ci

  pre_build:
    commands:
      - echo "Pre-build phase"

  build:
    commands:
      - echo "Running build (if any)..."
      # For example, TypeScript compile
      - npm run build

  post_build:
    commands:
      - echo "Build completed"
      - ls -la
artifacts:
  files:
    - backend/**/*
